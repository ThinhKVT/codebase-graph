version: '3.8'

services:
  # =============================================================================
  # GRAPH DATABASE
  # =============================================================================
  neo4j:
    image: neo4j:5.15.0
    container_name: codebase-graph-neo4j
    ports:
      - "7474:7474"   # HTTP (Browser UI)
      - "7687:7687"   # Bolt (Driver connection)
    environment:
      - NEO4J_AUTH=neo4j/codebase123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # VECTOR DATABASE (Semantic Search)
  # =============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codebase-graph-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # EMBEDDING SERVICE (Local LLM)
  # =============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: codebase-graph-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Note: After first start, run: docker exec codebase-graph-ollama ollama pull nomic-embed-text

  # =============================================================================
  # INDEXER SERVICE
  # =============================================================================
  indexer:
    image: codebase-graph:multijava
    container_name: codebase-graph-indexer
    volumes:
      - ./demo:/projects
      - indexer_data:/root/.codebase-graph
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=codebase123
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    depends_on:
      - neo4j
      - qdrant
      - ollama
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  ollama_data:
  indexer_data:

